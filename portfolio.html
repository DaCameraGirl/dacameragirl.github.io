<title>DaCameraGirl — Portfolio</title>

<style>
:root{
  --bg:#0f0a1a; --bg2:#1a1130; --card:#21143aee; --card2:#2a1850;
  --pink:#ff3d9a; --purple:#8b5cf6; --cyan:#22d3ee; --amber:#fbbf24;
  --text:#f0e8ff; --muted:#a898c8; --border:#3a2566;
  --green:#34d399;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:radial-gradient(1200px 800px at 15% -10%, #3b1a6b44, transparent), radial-gradient(1000px 600px at 90% 0%, #ff3d9a1a, transparent), var(--bg); color:var(--text); min-height:100vh; padding:28px 22px 60px}
.wrap{max-width:1150px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--pink),var(--purple),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:.95rem}
.pill{background:#ffffff14;border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:.82rem;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid4{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--card),#1c1035ee);border:1px solid var(--border);border-radius:18px;padding:18px 18px;box-shadow:0 10px 40px #00000040}
.stat-label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.stat-val{font-size:2rem;font-weight:800}
.stat-val.pink{color:var(--pink)}
.stat-val.purple{color:var(--purple)}
.stat-val.cyan{color:var(--cyan)}
.stat-val.amber{color:var(--amber)}
.stat-sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.chart-card{margin-bottom:22px}
.chart-card h2{font-size:1.05rem;font-weight:700;margin-bottom:12px;color:var(--text)}
.chart-wrap{position:relative;height:260px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{background:#1a0f32;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:.9rem;outline:none}
.toolbar input{flex:1;min-width:200px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--purple)}
.filter-box{display:flex;gap:8px;background:#1a0f32;border:1px solid var(--border);border-radius:10px;padding:5px}
.filter-btn{background:transparent;border:1px solid transparent;color:var(--muted);border-radius:8px;padding:5px 14px;font-family:inherit;font-size:.84rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-btn:hover{color:var(--text)}
.filter-btn.on-public{background:#34d39922;color:#34d399;border-color:#34d39933}
.filter-btn.on-private{background:#fbbf2422;color:var(--amber);border-color:#fbbf2433}
.filter-btn.off{opacity:.45}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:600}
.badge-private{background:#fbbf2422;color:var(--amber);border:1px solid #fbbf2433}
.badge-public{background:#34d39922;color:var(--green);border:1px solid #34d39933}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{position:sticky;top:0;background:#22143d;z-index:2;text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--text)}
tbody td{padding:12px 14px;border-bottom:1px solid #2e1c52;font-size:.92rem;vertical-align:top}
tbody tr{transition:background .12s}
tbody tr:hover{background:#ffffff08}
.repo-name{font-weight:600;color:var(--text)}
.repo-name a{color:inherit;text-decoration:none}
.repo-name a:hover{color:var(--cyan)}
.date-col{color:var(--muted);white-space:nowrap;font-size:.86rem}
.grid-wrap{max-height:580px;overflow:auto;border-radius:14px}
.grid-wrap::-webkit-scrollbar{width:8px;height:8px}
.grid-wrap::-webkit-scrollbar-thumb{background:#3a2566;border-radius:4px}
.count-note{font-size:.82rem;color:var(--muted);margin-left:auto}
footer{margin-top:28px;color:var(--muted);font-size:.82rem;text-align:center}
a{color:var(--cyan)}
.sort-arw{opacity:.5;font-size:.7em;margin-left:4px}
</style>
</head>

<header>

</div>

<div class="card chart-card">

</div>

<div class="card">

    </div>
    <span class="count-note" id="rowCount">104 repos</span>
  </div>
  <div class="grid-wrap">
  <table id="grid">
    <thead><tr>

      <th data-k="private">Visibility <span class="sort-arw">↕</span></th>
      <th>Link</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>
</div>

<footer>Built with ♥ · github.com/DaCameraGirl</footer>
</div>

//github.com/DaCameraGirl/GLB_FACTORY"}, {"Repo Name": "Solitaire", "Created Date": "July 07, 2026", "Private": "No", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/Solitaire"}, {"Repo Name": "The-Atelier", "Created Date": "July 07, 2026", "Private": "No", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/The-Atelier"}, {"Repo Name": "Worldcraft", "Created Date": "July 07, 2026", "Private": "No", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/Worldcraft"}, {"Repo Name": "BOB_SHELL_ANALYSIS", "Created Date": "July 09, 2026", "Private": "No", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/BOB_SHELL_ANALYSIS"}, {"Repo Name": "THE_UPSIDE_DOWN_ANGEL", "Created Date": "July 09, 2026", "Private": "No", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/THE_UPSIDE_DOWN_ANGEL"}, {"Repo Name": "The_Atelier", "Created Date": "July 10, 2026", "Private": "Yes", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/The_Atelier"}, {"Repo Name": "whoop-quest", "Created Date": "July 14, 2026", "Private": "No", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/whoop-quest"}, {"Repo Name": "openclaw-saturday-repo", "Created Date": "July 18, 2026", "Private": "No", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/openclaw-saturday-repo"}, {"Repo Name": "mobile-mechanics", "Created Date": "July 22, 2026", "Private": "No", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/mobile-mechanics"}, {"Repo Name": "DeckFlowWeb", "Created Date": "July 24, 2026", "Private": "No", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/DeckFlowWeb"}, {"Repo Name": "Project_Seal", "Created Date": "August 01, 2026", "Private": "Yes", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/Project_Seal"}, {"Repo Name": "gator_bites", "Created Date": "August 08, 2026", "Private": "Yes", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/gator_bites"}, {"Repo Name": "pie-charts", "Created Date": "August 12, 2026", "Private": "No", "Contributors": "DaCameraGirl", "URL": "https://github.com/DaCameraGirl/pie-charts"}];

let filtered = [...REPOS];
let sortKey = 'date'; let sortDir = 1;

// --- timeline ---
const monthMap = {};
REPOS.forEach(r=>{
  const d = new Date(r['Created Date']);
  const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  monthMap[k] = (monthMap[k]||0)+1;
});
const months = Object.keys(monthMap).sort();
const labels = months.map(m=>{ const [y,mo]=m.split('-'); return new Date(y,mo-1).toLocaleDateString('en-US',{month:'short', year:'numeric'})});
const counts = months.map(m=>monthMap[m]);

// peak month
let peakI = 0; counts.forEach((c,i)=>{ if(c>counts[peakI]) peakI=i });
document.getElementById('st_peak').textContent = labels[peakI]||'—';
document.getElementById('st_peak_n').textContent = (counts[peakI]||0)+' repos shipped';

const ctx = document.getElementById('timeline').getContext('2d');
const grad = ctx.createLinearGradient(0,0,0,240);
grad.addColorStop(0,'rgba(255,61,154,.45)');
grad.addColorStop(1,'rgba(139,92,246,.05)');
new Chart(ctx,{
  type:'line',
  data:{labels, datasets:[{label:'Repos', data:counts, fill:true, backgroundColor:grad, borderColor:'#ff3d9a', borderWidth:2.5, tension:.38, pointRadius:3, pointBackgroundColor:'#ff3d9a'}]},
  options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{color:'#2a1a4a'},ticks:{color:'#a898c8'}}, y:{beginAtZero:true,grid:{color:'#2a1a4a'},ticks:{color:'#a898c8',precision:0}}}}
});

// --- grid ---
const tbody = document.getElementById('tbody');
function render(){
  tbody.innerHTML='';
  filtered.forEach(r=>{
    const tr=document.createElement('tr');
    const isPrivate = (r.Private+'').toLowerCase()==='yes' || r.Private===true;
    tr.innerHTML = `<td class="repo-name"><a href="${r.URL}" target="_blank" rel="noopener">${r['Repo Name']}</a></td>
      <td class="date-col">${r['Created Date']}</td>
      <td><span class="badge ${isPrivate?'badge-private':'badge-public'}">${isPrivate?'Private':'Public'}</span></td>
      <td><a href="${r.URL}" target="_blank">↗</a></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('rowCount').textContent = filtered.length+' repos';
  document.getElementById('liveCount').textContent = filtered.length+' repos';
}
function applyFilter(){
  const q = document.getElementById('q').value.toLowerCase();
  const showPublic = document.getElementById('btnPublic').classList.contains('on-public');
  const showPrivate = document.getElementById('btnPrivate').classList.contains('on-private');
  filtered = REPOS.filter(r=>{
    const isPrivate = (r.Private+'').toLowerCase()==='yes' || r.Private===true;
    if(isPrivate && !showPrivate) return false;
    if(!isPrivate && !showPublic) return false;
    if(q && !r['Repo Name'].toLowerCase().includes(q)) return false;
    return true;
  });
  doSort(false);
  render();
}
function doSort(toggle=true){
  filtered.sort((a,b)=>{
    let av,bv;
    if(sortKey==='name'){ av=a['Repo Name'].toLowerCase(); bv=b['Repo Name'].toLowerCase(); }
    else if(sortKey==='date'){ av=new Date(a['Created Date']); bv=new Date(b['Created Date']); }
    else { av=(a.Private+'').toLowerCase()==='yes'?1:0; bv=(b.Private+'').toLowerCase()==='yes'?1:0; }
    if(av<bv) return -sortDir;
    if(av>bv) return sortDir;
    return 0;
  });
}
document.querySelectorAll('#grid thead th[data-k]').forEach(th=>{
  th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=1;}
    doSort(false); render();
  };
});
document.getElementById('q').addEventListener('input', applyFilter);
document.getElementById('btnPublic').onclick = ()=>{
  document.getElementById('btnPublic').classList.toggle('on-public');
  document.getElementById('btnPublic').classList.toggle('off');
  applyFilter();
};
document.getElementById('btnPrivate').onclick = ()=>{
  document.getElementById('btnPrivate').classList.toggle('on-private');
  document.getElementById('btnPrivate').classList.toggle('off');
  applyFilter();
};
applyFilter();
</script>
